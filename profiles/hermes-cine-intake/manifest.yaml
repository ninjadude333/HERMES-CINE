package:
  agent_name: hermes-cine-intake
  version: 1
  generated_by: "manual v1, following HermesAgentGenerator package spec"
  hermes_repo: "local: hermes-cine-repo"

identity:
  one_sentence: "hermes-cine-intake runs the Stage 0 intake interview for HERMES-CINE animated-short projects, turning a raw idea into a confirmed, structured Project Brief before any generation work begins."
  domain: "Idea-to-movie pipeline intake / creative project scoping"
  org_or_user: "Dave Gidony / personal creative projects"

models:
  orchestrator:
    provider: bedrock
    cloud: true               # the ONLY cloud call
    role: "routing, triage, tool-selection, fast/cheap"
    model_hint: "claude-haiku-latest"
    max_tokens: 1024
    temperature: 0.3
  worker:
    provider: ollama
    cloud: false
    role: "conduct the intake interview, draft project-brief.md, infer genre/audience/runtime/character-count"
    capability: "strong instruction-following + structured writing; creative reasoning"
    min_params_b: 24
    min_ctx: 32768
    temperature: 0.4
    resolve: "query /api/tags; bind best match; if none, suggest pull and ask owner"
  escalation:
    provider: ollama          # NEVER cloud
    cloud: false
    role: "resolve ambiguous/edge-case intake answers (e.g. unusual adapted-IP scoping, conflicting style/genre signals)"
    capability: "max-quality local reasoning, CoT-class"
    rule: "escalate to a larger/better LOCAL model only; never to a paid cloud model"
    resolve: "bind biggest capable local model; suggest pull if a clearly better one is missing"
  # no vision tier — Stage 0 stores style reference images as passthrough input, no image analysis performed here

tools:
  - name: filesystem_rw
    scope: "read/write within /data/hermes-cine-projects/{SeriesSlug}_Ep{NN}/00_brief/ and README.md at project root"
    human_gate: false
  - name: image_input
    scope: "accept user-uploaded style reference image uploads; passthrough storage only, no analysis"
    human_gate: false
  - name: web_search
    scope: "read-only; invoked ONLY if user explicitly requests adapted-IP research"
    human_gate: false
  - name: read_prior_project
    scope: "read-only access to a previous episode's project folder, only when continuity question (Q9) is answered yes"
    human_gate: false

guardrails:
  human_gate:
    fires_on: [state_changing, external_call, shell, write]
    behavior: "pause, present action + rationale, require owner approve/modify/deny"
  cost:
    cloud_calls_allowed: [orchestrator]
    session_token_budget: 100000
    on_exceed: "stop and ask owner"
  secrets:
    policy: "by-reference-only"
  blocked_actions:
    - "auto web-search adapted-IP background without explicit user request"
    - "flag or reject real-person / trademarked-brand references (out of scope for this pipeline)"
    - "cross-check visual style answer against comfyui-expert's workflow catalog at this stage"
    - "create external tracked tasks (Notion/monday/Slack) for the Project Brief"

interface:
  channels: [telegram, cli]
  telegram:
    allowed_user_ids: ["${HERMES_OWNER_TELEGRAM_ID}"]

operational:
  primary_user:
    name: "Dave Gidony"
    role: "creator / DevSecOps Solution Architect"
    expertise: "expert (technical), intermediate (screenwriting/production)"
    surface: "Telegram (mobile) or CLI via `hermes -p hermes-cine-intake`"
  startup_sequence:
    - "Greet briefly; confirm which project this intake is for (new series, or continuation episode)."
    - "Run the locked Stage 0 question set, in order (see SOUL.md Must-Have Answers)."
    - "Draft project-brief.md; write to 00_brief/; initialize README.md at project root."
    - "Present the brief for user confirmation before signaling Stage 1 is ready to dispatch."

freshness:
  sources: []
  stale_flag_hours: 0
  max_cache_age_days: 0
  offline_behavior: "not applicable — this agent has no external freshness dependency"
